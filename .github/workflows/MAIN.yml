# GitHub Action for generating a contribution graph with a snake eating your contributions.

name: Generate Snake

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"

  # allows running the Action manually from the Actions tab
  workflow_dispatch:

  # regenerate whenever main is updated
  push:
    branches:
      - main

jobs:
  generate:
    # needed to push the generated files to the "output" branch
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Generates the snake (light and dark variants) from the contribution graph
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Pushes the contents of dist/ to the "output" branch, keeping main uncluttered.
      # Files are served at https://raw.githubusercontent.com/abhraneel2004/abhraneel2004/output/<file>
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
