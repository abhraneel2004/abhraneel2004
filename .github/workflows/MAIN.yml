# GitHub Action for generating a contribution graph with a snake eating your contributions.

name: Generate Snake

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"

  # allows running the Action manually from the Actions tab, optionally forcing a theme to preview it
  workflow_dispatch:
    inputs:
      theme:
        description: "Theme (auto picks by date)"
        type: choice
        default: auto
        options: [auto, neon, halloween, diwali, winter, newyear, holi]

  # regenerate whenever main is updated
  push:
    branches:
      - main

jobs:
  generate:
    # needed to push the generated files to the "output" branch
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Checks out the repo so the theme script is available
      - uses: actions/checkout@v7

      # Generates the snake (light and dark variants) from the contribution graph
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Re-skins the SVGs with a seasonal theme (neon arcade outside festival dates)
      - name: Apply seasonal theme
        run: node .github/scripts/snake-theme.mjs dist
        env:
          SNAKE_THEME: ${{ inputs.theme || 'auto' }}

      # Pushes the contents of dist/ to the "output" branch, keeping main uncluttered.
      # Files are served at https://raw.githubusercontent.com/abhraneel2004/abhraneel2004/output/<file>
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
